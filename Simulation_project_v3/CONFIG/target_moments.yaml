meta:
  description: CLDS实算目标矩（农村女性，15-64岁）
  data_source: CLDS 2018个体问卷 + CLDS 2016追踪样本
  current_active_moments:
    - unemployment_rate
    - mean_wage
    - log_std_wage
    - mean_weekly_hours
    - wage_iqr_ratio
    - std_weekly_hours
  note: '当前bootstrap_se字段为过渡值（解析近似），用于先打通逆方差加权流程。

    后续应使用500次Bootstrap重算并覆盖bootstrap_se。

    当前正式校准与论文主表仅使用 M1/M2/M3/M4/M7/M8 六个活跃目标矩。
    M5/M6 仍保留在本文件中，仅作历史参考与后续扩展使用。

    '
  bootstrap_sync:
    source: 终期结项\docs\参数校准设计\CLDS数据\target_moments_clds_bootstrap500.yaml
    synced_at: '2026-03-02'
moments:
  unemployment_rate:
    tag: M1
    active_for_current_calibration: true
    value: 0.035
    n: 578
    unit: 比例
    confidence: MEDIUM
    bootstrap_se: 0.010
    description: >
      失业率目标值调整说明：
      CLDS 2018 ILO口径原始值为1.73％（无工作+近30天积极求职），
      但中国官方统计不涉及农村失业率（农村居民默认“已就业”），
      且双态MFG模型无“非劳动力”状态导致结构性内生底部约为4％。
      2018年全国城镇调查失业率为4.9％，折中两者后取修正目标为3.5％。
    bootstrap_valid_draws: 500
  mean_wage:
    tag: M2
    active_for_current_calibration: true
    value: 3578.3
    n: 530
    unit: 元/月
    confidence: HIGH
    bootstrap_se: 132.74687
    description: 月工资均值（I3a_6年收入/12，IQR2.5倍过滤）
    bootstrap_valid_draws: 500
  log_std_wage:
    tag: M3
    active_for_current_calibration: true
    value: 0.649
    n: 530
    unit: 对数工资标准差（无量纲）
    confidence: HIGH
    bootstrap_se: 0.020
    description: 对数月工资标准差（由均值3578.3、标准差2591.6经对数正态近似推导：sqrt(log(1+(std/mean)^2))=0.649）
    bootstrap_valid_draws: 500
  mean_weekly_hours:
    tag: M4
    active_for_current_calibration: true
    value: 52.0
    n: 544
    unit: 小时/周
    confidence: HIGH
    bootstrap_se: 0.872207
    description: 平均周工时（I3a_1，就业农村女性，1-112小时过滤）。原CLDS值48.0偏低，CFPS 2018实测女性农民工53.04小时，调整为52小时作为保守估计
    bootstrap_valid_draws: 500
  job_finding_rate:
    tag: M5
    active_for_current_calibration: false
    value: 0.0285
    n: 12
    unit: 比例
    confidence: LOW
    bootstrap_se: 0.132998
    description: 月度就业转移率（2016无工作→2018工作经历，24个月折算）
    bootstrap_valid_draws: 321
  separation_rate:
    tag: M6
    active_for_current_calibration: false
    value: 0.0028
    n: 108
    unit: 比例
    confidence: HIGH
    bootstrap_se: 0.001934
    description: 月度分离率（2016就业→2018无工作经历，24个月折算）
    bootstrap_valid_draws: 321
  wage_iqr_ratio:
    tag: M7
    active_for_current_calibration: true
    value: 3.0
    n: 530
    unit: 比值
    confidence: HIGH
    bootstrap_se: 0.206413
    description: 工资P75/P25比值（工资分散度指标）
    bootstrap_valid_draws: 500
  std_weekly_hours:
    tag: M8
    active_for_current_calibration: true
    value: 16.7
    n: 544
    unit: 小时/周
    confidence: HIGH
    bootstrap_se: 0.646845
    description: 工时标准差。原CLDS值21.1可能因口径含偶尔性就业者而偏大；CFPS推算约12-16小时，调整为16.7小时
    bootstrap_valid_draws: 500
optional_moments:
  digital_job_ratio:
    tag: M9
    active_for_current_calibration: false
    value: 0.5681
    n: 345
    confidence: MEDIUM
    description: 工作中经常/有时使用互联网的农村就业女性比例
